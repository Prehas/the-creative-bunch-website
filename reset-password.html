<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://the-creative-bunch-content-api.vercel.app; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Set your password | The Creative Bunch</title>
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>
    <main>
        <p class="wordmark">THE CREATIVE BUNCH</p>
        <h1>Set your password</h1>
        <p>Choose a password for your private studio dashboard account.</p>
        <form id="reset-password-form">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="password-hint" required>
            <p id="password-hint">Use 12–128 characters. A unique passphrase works well.</p>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <button type="submit">Save password</button>
        </form>
        <p id="reset-status" role="status" aria-live="polite"></p>
        <a href="login.html">Back to sign in</a>
    </main>
    <script src="reset-password.js"></script>
</body>
</html>
